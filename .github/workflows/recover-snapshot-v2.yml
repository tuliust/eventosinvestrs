name: Recover Eventos + Bem-vindo source v2

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/recover-snapshot-v2.yml"

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore recovered snapshot
        shell: bash
        run: |
          set -euo pipefail
          test -f .recovery/snapshot.tar.xz.b64
          base64 --decode .recovery/snapshot.tar.xz.b64 > /tmp/eventosinvestrs-recovery.tar.xz
          tar -xJf /tmp/eventosinvestrs-recovery.tar.xz -C .
          rm -rf .recovery
          rm -f /tmp/eventosinvestrs-recovery.tar.xz

      - name: Commit recovered source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No recovery changes to commit."
            exit 0
          fi
          git commit -m "restore: recover Eventos + Bem-vindo source"
          git push origin HEAD:main
